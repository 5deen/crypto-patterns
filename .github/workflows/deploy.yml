name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy the current main without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages authenticates to the Pages service with an OIDC token.
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so an in-flight
# deploy is allowed to finish rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

# Action majors are kept current because the runner drops Node 20 on
# 2026-09-16. Older majors still run today, forced onto Node 24 with a
# deprecation warning, but stop working then. GitHub's own Pages docs still
# suggest configure-pages@v5 and deploy-pages@v4 — those are the versions that
# warn, so the majors below come from the actions' own tags instead.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
